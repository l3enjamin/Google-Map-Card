name: CI Validation

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  validate-js:
    name: Validate JavaScript & Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax Check JavaScript
        run: |
          node --check google-maps-card.js
          node --check themes.js

      - name: Validate JSON schemas
        run: |
          node -e "JSON.parse(require('fs').readFileSync('hacs.json', 'utf8')); console.log('hacs.json is valid JSON');"
